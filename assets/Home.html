<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SkyNet Home</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: #eee8e1; background: radial-gradient(ellipse at 50% -10%, #3c2a20 0%, #191719 42%, #0c0c0e 100%); }
    main { width: min(1080px, 92vw); margin: 0 auto; padding: clamp(34px, 8vh, 110px) 0 60px; text-align: center; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 22px; }
    .brand img { width: 74px; height: 74px; object-fit: contain; filter: drop-shadow(0 8px 17px #000c); }
    .brand h1 { margin: 0; color: #efa866; letter-spacing: .20em; font-size: clamp(28px, 5vw, 52px); }
    .brand span { display: block; margin-top: 4px; color: #b9a99d; letter-spacing: .1em; font-size: 11px; text-transform: uppercase; }
    form { display: flex; width: min(730px, 100%); margin: 0 auto; padding: 6px; border: 1px solid #5e4940; border-radius: 18px; background: #171618df; box-shadow: 0 17px 50px #0007; }
    form:focus-within { border-color: #e19a58; box-shadow: 0 0 0 3px #d57c3426, 0 17px 50px #0007; }
    input { min-width: 0; border: 0; outline: 0; flex: 1; padding: 13px 15px; color: #fbf6f0; background: transparent; font: inherit; }
    button { border: 1px solid #5a4a44; border-radius: 10px; padding: 10px 14px; color: #fff8ef; background: #292528; font: inherit; cursor: pointer; }
    button:hover { background: #423831; border-color: #e09a58; }
    form button { border: 0; padding-inline: 20px; color: #241811; background: #e5a15f; font-weight: 700; }
    form button:hover { background: #f4bd82; }
    .section-title { margin: 45px 0 15px; color: #d1c0b2; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    #shortcuts { display: grid; grid-template-columns: repeat(5, minmax(112px, 1fr)); gap: 13px; margin: 0 auto; }
    .shortcut { min-height: 126px; padding: 17px 10px 12px; border: 1px solid #423a39; border-radius: 15px; color: #f3ece5; background: #181719cc; box-shadow: 0 12px 28px #0004; text-align: center; cursor: pointer; transition: transform .13s ease, border-color .13s ease; }
    .shortcut:hover { transform: translateY(-3px); border-color: #d99b61; }
    .shortcut img, .fallback { display: grid; width: 48px; height: 48px; margin: 0 auto 11px; place-items: center; border-radius: 13px; color: #fff; background: #332d2b; font-size: 22px; font-weight: 700; object-fit: cover; }
    .shortcut .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .shortcut.empty { display: grid; place-content: center; gap: 8px; color: #a99c94; border-style: dashed; }
    .shortcut.empty .plus { color: #dfa364; font-size: 31px; line-height: 1; }
    .channel { display: grid; grid-template-columns: auto 1fr; gap: 14px; max-width: 730px; margin: 46px auto 0; padding: 17px 19px; border: 1px solid #3d3635; border-radius: 14px; background: #141315c9; text-align: left; }
    .channel .pulse { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: #df9959; box-shadow: 0 0 13px #e6a061; }
    .channel strong { font-size: 14px; }.channel p { margin: 4px 0 0; color: #aca29b; font-size: 13px; line-height: 1.5; }
    #editor { position: fixed; z-index: 10; display: none; width: min(460px, 88vw); padding: 22px; border: 1px solid #756054; border-radius: 16px; background: #201d20; box-shadow: 0 22px 60px #000c; text-align: left; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #editor h2 { margin: 0 0 12px; color: #f1b574; font-size: 20px; } #editor label { display: block; margin: 13px 0 5px; color: #c8bab0; font-size: 12px; }
    #editor input { width: 100%; padding: 11px 12px; border: 1px solid #5d514c; border-radius: 8px; background: #121114; }
    #editor .actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; } #delete { margin-right: auto; color: #ffb2ae; border-color: #8f4d4a; }
    @media (max-width: 720px) { #shortcuts { grid-template-columns: repeat(3, 1fr); }.brand img { width: 58px; height: 58px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="SkyNetLogo.png" alt="SkyNet"><div><h1>SKYNET</h1><span>Your browser in Skyrim</span></div></div>
    <form id="search"><input id="query" autocomplete="off" placeholder="Search Google or enter an address"><button>Search</button></form>
    <div class="section-title">Your shortcuts</div><section id="shortcuts"></section>
    <section class="channel"><span class="pulse"></span><div><strong>SkyNet channel log</strong><p>Welcome to SkyNet. Add up to five personal shortcuts, browse from the address bar, and use the menu for bookmarks, history, extensions, and settings.</p></div></section>
  </main>
  <section id="editor"><h2 id="editorTitle">Add shortcut</h2><label>Name</label><input id="name" maxlength="60" placeholder="Example: YouTube"><label>Website URL</label><input id="url" placeholder="https://example.com"><label>Logo URL (optional)</label><input id="logo" placeholder="Fetched automatically when left blank"><div class="actions"><button id="delete" type="button">Delete</button><button id="cancel" type="button">Cancel</button><button id="save" type="button">Save shortcut</button></div></section>
  <script>
    const shortcuts = Array.from({length:5}, (_,i)=>({i,t:'',u:'',l:''}));
    const $ = id => document.getElementById(id), clean = value => String(value || '').replace(/[|\r\n\t]/g, ' ').trim();
    let editing = 0;
    const favicon = shortcut => shortcut.l || `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(shortcut.u)}`;
    function esc(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function render() {
      $('shortcuts').innerHTML = shortcuts.map(s => s.u ? `<button class="shortcut" data-index="${s.i}" title="${esc(s.u)}"><img src="${esc(favicon(s))}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'⌁'}))"><span class="title">${esc(s.t || s.u)}</span></button>` : `<button class="shortcut empty" data-index="${s.i}"><span class="plus">+</span><span>Add shortcut</span></button>`).join('');
      document.querySelectorAll('.shortcut').forEach(button => {
        const index = Number(button.dataset.index);
        button.onclick = () => shortcuts[index].u ? chrome.webview.postMessage(`home:open:${shortcuts[index].u}`) : openEditor(index);
        button.oncontextmenu = event => { event.preventDefault(); openEditor(index); };
      });
    }
    function openEditor(index) { editing = index; const s = shortcuts[index]; $('editorTitle').textContent = s.u ? 'Edit shortcut' : 'Add shortcut'; $('name').value = s.t; $('url').value = s.u; $('logo').value = s.l; $('delete').style.display = s.u ? '' : 'none'; $('editor').style.display = 'block'; $('name').focus(); }
    function closeEditor() { $('editor').style.display = 'none'; }
    $('cancel').onclick = closeEditor;
    $('delete').onclick = () => { chrome.webview.postMessage(`home:shortcut:remove:${editing}`); shortcuts[editing] = {i:editing,t:'',u:'',l:''}; closeEditor(); render(); };
    $('save').onclick = () => { const title=clean($('name').value), url=clean($('url').value), logo=clean($('logo').value); if(!url) { $('url').focus(); return; } chrome.webview.postMessage(`home:shortcut:set:${editing}|${title}|${url}|${logo}`); shortcuts[editing]={i:editing,t:title,u:url,l:logo}; closeEditor(); render(); };
    $('search').onsubmit = event => { event.preventDefault(); const query=clean($('query').value); if(query) chrome.webview.postMessage(`home:search:${query}`); };
    chrome.webview.addEventListener('message', event => { const data = event.data; if (data && data.type === 'shortcuts' && Array.isArray(data.items)) { data.items.forEach(item => { if (Number.isInteger(item.i) && item.i >= 0 && item.i < shortcuts.length) shortcuts[item.i] = item; }); render(); } });
    chrome.webview.postMessage('home:ready'); render();
  </script>
</body>
</html>
