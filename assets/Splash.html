<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starting SkyNet Browser</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #050505; overflow: hidden; }
    #fallback { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <img id="fallback" src="SkyNetLogo.png" alt="SkyNet">
  <video id="splash" autoplay muted playsinline preload="auto" poster="SkyNetLogo.png">
    <source src="Splash.mp4" type="video/mp4">
  </video>
  <script>
    const splash = document.getElementById('splash');
    let finished = false;
    const finish = () => { if (!finished) { finished = true; chrome.webview.postMessage('splash:finished'); } };
    const fallback = () => setTimeout(finish, 1500);
    splash.addEventListener('ended', finish, { once: true });
    splash.addEventListener('error', fallback, { once: true });
    splash.play().catch(fallback);
  </script>
</body>
</html>
